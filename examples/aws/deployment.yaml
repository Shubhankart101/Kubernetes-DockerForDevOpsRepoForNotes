apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtrack-aws
spec:
  replicas: 2
  selector:
    matchLabels: { app: devtrack-aws }
  template:
    metadata:
      labels: { app: devtrack-aws }
    spec:
      containers:
        - name: web
          image: YOUR_ACCOUNT.dkr.ecr.REGION.amazonaws.com/devtrack:1.0.0
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: devtrack-aws
spec:
  selector: { app: devtrack-aws }
  ports: [{ port: 80, targetPort: 80 }]
  type: LoadBalancer
