# Question 25: What is a Secret?
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-solution-25
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-solution-25
  template:
    metadata:
      labels:
        app: interview-solution-25
    spec:
      containers:
        - name: solution
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi