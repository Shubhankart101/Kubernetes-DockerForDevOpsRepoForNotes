apiVersion: apps/v1
kind: Deployment
metadata: { name: api-liveness }
spec:
  selector: { matchLabels: { app: api-liveness } }
  template:
    metadata: { labels: { app: api-liveness } }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
