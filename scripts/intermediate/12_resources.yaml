apiVersion: apps/v1
kind: Deployment
metadata: { name: api-resources }
spec:
  selector: { matchLabels: { app: api-resources } }
  template:
    metadata: { labels: { app: api-resources } }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
