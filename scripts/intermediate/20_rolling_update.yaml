apiVersion: apps/v1
kind: Deployment
metadata: { name: api-rolling }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: api-rolling } }
  template:
    metadata: { labels: { app: api-rolling } }
    spec:
      containers: [{ name: api, image: nginx:1.27-alpine }]
